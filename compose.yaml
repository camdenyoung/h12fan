services:
  h12fan:
    build: .
    image: h12fan:local
    restart: unless-stopped
    init: true
    ports:
      - "${H12FAN_LISTEN_ADDRESS:-127.0.0.1}:${H12FAN_WEB_PORT:-8080}:8080"
    environment:
      H12FAN_DEMO: "${H12FAN_DEMO:-true}"
      IPMI_HOST: "${IPMI_HOST:-}"
      IPMI_USER: "${IPMI_USER:-}"
      IPMI_PASSWORD: "${IPMI_PASSWORD:-}"
      IPMI_PORT: "${IPMI_PORT:-623}"
      IPMI_CIPHER: "${IPMI_CIPHER:-17}"
      H12FAN_WEB_PASSWORD: "${H12FAN_WEB_PASSWORD:-}"
    volumes:
      - h12fan-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
volumes:
  h12fan-data:
